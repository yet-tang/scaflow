version: 1
task:
  id: SFL-030
  title: Workspace Cleanup
  type: workspace
  risk_level: R2
  definition_state: ready
objective:
  summary: Implement safe TaskRun cleanup commands that preserve evidence and never delete workspace/repos or state.db.
source_requirements:
  - id: FR-018
    document: docs/source/scaflow-v0.1.0-prd.md
dependencies:
  - SFL-029
repositories:
  primary: "@control"
  scopes:
    - repository: "@control"
      access: read-write
      allowed_paths:
        - packages/workspace/**
        - packages/state/**
        - apps/cli/**
        - fixtures/**
      forbidden_paths:
        - docs/source/scaflow-v0.1.0-prd.md
        - workspace/repos/**
        - .scaflow/state.db
acceptance_criteria:
  - id: SFL-030-AC-01
    description: run clean refuses to clean running TaskRuns.
  - id: SFL-030-AC-02
    description: run clean does not silently delete TaskRuns with uncommitted diffs.
  - id: SFL-030-AC-03
    description: cleanup saves diff, logs, and evidence before deleting TaskRun workspace data.
  - id: SFL-030-AC-04
    description: cleanup never deletes workspace/repos or .scaflow/state.db.
verification:
  commands:
    - repository: "@control"
      executable: pnpm
      args: ["--filter", "@scaflow/workspace", "test"]
      timeout_seconds: 300
      required: true
    - repository: "@control"
      executable: pnpm
      args: ["--filter", "@scaflow/cli", "test"]
      timeout_seconds: 300
      required: true
    - repository: "@control"
      executable: pnpm
      args: ["typecheck"]
      timeout_seconds: 300
      required: true
retry_policy:
  max_attempts: 2
  max_repair_rounds_per_attempt: 3
  escalate_after_same_failure: 2
