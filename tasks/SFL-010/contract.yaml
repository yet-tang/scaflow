version: 1
task:
  id: SFL-010
  title: Template Engine
  type: foundation
  risk_level: R3
  definition_state: completed
objective:
  summary: Render Scaflow Project Repository templates without overwriting user-modified files.
source_requirements:
  - id: FR-001
    document: docs/source/scaflow-v0.1.0-prd.md
  - id: NFR-002
    document: docs/source/scaflow-v0.1.0-prd.md
dependencies:
  - SFL-008
  - SFL-009
dependency_changes: allowed
repositories:
  primary: "@control"
  scopes:
    - repository: "@control"
      access: read-write
      allowed_paths:
        - packages/template/**
        - templates/default-project-scaflow/**
        - fixtures/projects/**
        - pnpm-lock.yaml
      forbidden_paths:
        - docs/source/scaflow-v0.1.0-prd.md
        - workspace/**
        - .scaflow/**
acceptance_criteria:
  - id: SFL-010-AC-01
    description: Template rendering creates required SPR files and directories.
  - id: SFL-010-AC-02
    description: Re-running template rendering never overwrites modified user files.
  - id: SFL-010-AC-03
    description: Template .gitignore excludes workspace/ and .scaflow/.
  - id: SFL-010-AC-04
    description: Rendering is confined to the selected destination under pre-existing symlink ancestry and concurrent destination-ancestor replacement attempts.
  - id: SFL-010-AC-05
    description: Failed writes and publication races leave no incomplete destination files or temporary artifacts, and a later render can recover.
  - id: SFL-010-AC-06
    description: Native dependency changes are limited to node-addon-api@8.8.0 and node-gyp@13.0.0 required by packages/template; no other runtime or development dependency may be added.
verification:
  commands:
    - repository: "@control"
      executable: pnpm
      args: ["--filter", "@scaflow/template", "build"]
      timeout_seconds: 300
      required: true
    - repository: "@control"
      executable: pnpm
      args: ["--filter", "@scaflow/template", "test"]
      timeout_seconds: 300
      required: true
    - repository: "@control"
      executable: pnpm
      args: ["typecheck"]
      timeout_seconds: 300
      required: true
    - repository: "@control"
      executable: pnpm
      args: ["test"]
      timeout_seconds: 900
      required: true
retry_policy:
  max_attempts: 2
  max_repair_rounds_per_attempt: 3
  escalate_after_same_failure: 2
