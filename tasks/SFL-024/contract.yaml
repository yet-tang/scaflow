version: 1
task:
  id: SFL-024
  title: Command Verifier
  type: verification
  risk_level: R2
  definition_state: ready
objective:
  summary: Run Task Contract verification commands through the structured command runner and record command results.
source_requirements:
  - id: FR-011
    document: docs/source/scaflow-v0.1.0-prd.md
dependencies:
  - SFL-023
dependency_changes: forbidden
repositories:
  primary: "@control"
  scopes:
    - repository: "@control"
      access: read-write
      allowed_paths:
        - packages/verification/**
        - packages/state/**
        - packages/schemas/**
        - fixtures/**
      forbidden_paths:
        - docs/source/scaflow-v0.1.0-prd.md
        - workspace/repos/**
        - .scaflow/state.db
acceptance_criteria:
  - id: SFL-024-AC-01
    description: Required verification commands fail the run when their exit code is non-zero.
  - id: SFL-024-AC-02
    description: Optional commands are recorded without forcing failure.
  - id: SFL-024-AC-03
    description: Command results include repository ID, cwd, argv, timeout, exit code, truncated output, and artifacts.
verification:
  commands:
    - repository: "@control"
      executable: pnpm
      args: ["--filter", "@scaflow/verification", "test"]
      timeout_seconds: 300
      required: true
    - repository: "@control"
      executable: pnpm
      args: ["typecheck"]
      timeout_seconds: 300
      required: true
    - repository: "@control"
      executable: pnpm
      args: ["test"]
      timeout_seconds: 900
      required: true
retry_policy:
  max_attempts: 2
  max_repair_rounds_per_attempt: 3
  escalate_after_same_failure: 2
