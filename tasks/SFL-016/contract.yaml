version: 1
task:
  id: SFL-016
  title: Revision Set
  type: git
  risk_level: R2
  definition_state: ready
objective:
  summary: Freeze the SPR and scoped application repositories into an immutable TaskRun Revision Set.
source_requirements:
  - id: G-004
    document: docs/source/scaflow-v0.1.0-prd.md
  - id: FR-006
    document: docs/source/scaflow-v0.1.0-prd.md
dependencies:
  - SFL-012
  - SFL-014
  - SFL-015
dependency_changes: forbidden
repositories:
  primary: "@control"
  scopes:
    - repository: "@control"
      access: read-write
      allowed_paths:
        - packages/git/**
        - packages/workspace/**
        - packages/schemas/**
        - packages/state/**
        - fixtures/**
      forbidden_paths:
        - docs/source/scaflow-v0.1.0-prd.md
        - workspace/repos/**
        - .scaflow/state.db
acceptance_criteria:
  - id: SFL-016-AC-01
    description: Revision Set records @control and every scoped application repository base commit and access mode.
  - id: SFL-016-AC-02
    description: Revision Set does not update automatically when remote branches move after preparation.
  - id: SFL-016-AC-03
    description: Repository identity is checked before commits are recorded.
verification:
  commands:
    - repository: "@control"
      executable: pnpm
      args: ["--filter", "@scaflow/git", "test"]
      timeout_seconds: 300
      required: true
    - repository: "@control"
      executable: pnpm
      args: ["--filter", "@scaflow/workspace", "test"]
      timeout_seconds: 300
      required: true
    - repository: "@control"
      executable: pnpm
      args: ["typecheck"]
      timeout_seconds: 300
      required: true
    - repository: "@control"
      executable: pnpm
      args: ["test"]
      timeout_seconds: 900
      required: true
retry_policy:
  max_attempts: 2
  max_repair_rounds_per_attempt: 3
  escalate_after_same_failure: 2
