version: 1
task:
  id: SFL-011
  title: Scaflow Init and Validate
  type: cli
  risk_level: R2
  definition_state: ready
objective:
  summary: Implement scaflow init and scaflow validate using the template engine and project schemas.
source_requirements:
  - id: FR-001
    document: docs/source/scaflow-v0.1.0-prd.md
dependencies:
  - SFL-004
  - SFL-010
repositories:
  primary: "@control"
  scopes:
    - repository: "@control"
      access: read-write
      allowed_paths:
        - apps/cli/**
        - packages/core/**
        - packages/config/**
        - packages/template/**
        - fixtures/projects/**
      forbidden_paths:
        - docs/source/scaflow-v0.1.0-prd.md
        - workspace/**
        - .scaflow/**
acceptance_criteria:
  - id: SFL-011-AC-01
    description: scaflow init creates a valid SPR in an empty directory.
  - id: SFL-011-AC-02
    description: scaflow validate passes for a generated SPR and fails with structured errors for invalid configs.
  - id: SFL-011-AC-03
    description: init is idempotent and does not overwrite user-modified files.
verification:
  commands:
    - repository: "@control"
      executable: pnpm
      args: ["--filter", "@scaflow/cli", "test"]
      timeout_seconds: 300
      required: true
    - repository: "@control"
      executable: pnpm
      args: ["typecheck"]
      timeout_seconds: 300
      required: true
retry_policy:
  max_attempts: 2
  max_repair_rounds_per_attempt: 3
  escalate_after_same_failure: 2
