version: 1
task:
  id: SFL-004
  title: CLI Foundation
  type: cli
  risk_level: R1
  definition_state: ready
objective:
  summary: Register the scaflow CLI, global options, JSON output mode, and stable error rendering without implementing business commands.
source_requirements: []
source_references:
  - document: docs/source/scaflow-v0.1.0-prd.md
    section: "12. CLI 范围"
  - document: docs/exec-plans/scaflow-v0.1.0.md
    section: "Milestones And Tasks / SFL-004 CLI Foundation"
dependencies:
  - SFL-002
  - SFL-003
dependency_changes: allowed
repositories:
  primary: "@control"
  scopes:
    - repository: "@control"
      access: read-write
      allowed_paths:
        - pnpm-lock.yaml
        - apps/cli/**
        - packages/core/**
      forbidden_paths:
        - docs/source/scaflow-v0.1.0-prd.md
        - workspace/**
        - .scaflow/**
acceptance_criteria:
  - id: SFL-004-AC-01
    description: The CLI binary name is scaflow and the old harness name is not introduced.
  - id: SFL-004-AC-02
    description: Stub commands return stable not-implemented errors and support JSON output.
  - id: SFL-004-AC-03
    description: CLI tests cover help output, JSON errors, and command registration.
verification:
  commands:
    - repository: "@control"
      executable: pnpm
      args: ["--filter", "@scaflow/cli", "test"]
      timeout_seconds: 300
      required: true
    - repository: "@control"
      executable: pnpm
      args: ["typecheck"]
      timeout_seconds: 300
      required: true
    - repository: "@control"
      executable: pnpm
      args: ["test"]
      timeout_seconds: 900
      required: true
retry_policy:
  max_attempts: 2
  max_repair_rounds_per_attempt: 3
  escalate_after_same_failure: 2
