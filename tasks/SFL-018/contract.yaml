version: 1
task:
  id: SFL-018
  title: Context Assembler
  type: workspace
  risk_level: R3
  definition_state: ready
objective:
  summary: Assemble TaskRun AGENTS.md, context manifest, knowledge snapshots, and @control behavior without exposing secrets or unrelated source.
source_requirements:
  - id: FR-007
    document: docs/source/scaflow-v0.1.0-prd.md
  - id: SEC-001
    document: docs/source/scaflow-v0.1.0-prd.md
dependencies:
  - SFL-015
  - SFL-017
dependency_changes: forbidden
repositories:
  primary: "@control"
  scopes:
    - repository: "@control"
      access: read-write
      allowed_paths:
        - packages/workspace/**
        - packages/core/**
        - packages/schemas/**
        - fixtures/projects/**
      forbidden_paths:
        - docs/source/scaflow-v0.1.0-prd.md
        - workspace/repos/**
        - .scaflow/**
acceptance_criteria:
  - id: SFL-018-AC-01
    description: Context manifest lists included task contract, project knowledge, repository summaries, verification commands, and failure summary when present.
  - id: SFL-018-AC-02
    description: "@control undeclared, read-only, and read-write modes are handled and tested separately."
  - id: SFL-018-AC-03
    description: Context excludes secrets, other TaskRuns, .scaflow/state.db, unrelated source, and the user home.
verification:
  commands:
    - repository: "@control"
      executable: pnpm
      args: ["--filter", "@scaflow/workspace", "test"]
      timeout_seconds: 300
      required: true
    - repository: "@control"
      executable: pnpm
      args: ["typecheck"]
      timeout_seconds: 300
      required: true
    - repository: "@control"
      executable: pnpm
      args: ["test"]
      timeout_seconds: 900
      required: true
retry_policy:
  max_attempts: 2
  max_repair_rounds_per_attempt: 3
  escalate_after_same_failure: 2
