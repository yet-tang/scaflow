version: 1
task:
  id: SFL-032
  title: Security Policy Schema and Loader
  type: control-plane-change
  risk_level: R3
  definition_state: ready
objective:
  summary: Define security and command policy schemas, protected paths, network defaults, shell policy, and policy loading precedence.
source_requirements:
  - id: SEC-001
    document: docs/source/scaflow-v0.1.0-prd.md
  - id: SEC-002
    document: docs/source/scaflow-v0.1.0-prd.md
  - id: SEC-003
    document: docs/source/scaflow-v0.1.0-prd.md
dependencies:
  - SFL-003
  - SFL-008
dependency_changes: allowed
repositories:
  primary: "@control"
  scopes:
    - repository: "@control"
      access: read-write
      allowed_paths:
        - pnpm-lock.yaml
        - packages/schemas/**
        - packages/config/**
        - templates/default-project-scaflow/policies/**
        - fixtures/projects/**
      forbidden_paths:
        - docs/source/scaflow-v0.1.0-prd.md
        - workspace/**
        - .scaflow/**
acceptance_criteria:
  - id: SFL-032-AC-01
    description: policies/security.yaml and policies/command-policy.yaml schemas define protected paths, writable roots, network defaults, Docker socket visibility, shell policy, and control-plane protection.
  - id: SFL-032-AC-02
    description: After project initialization, project-local policy files are authoritative; missing or invalid required files fail closed, and loading does not fall back to user-home or environment policy files.
  - id: SFL-032-AC-03
    description: control-plane-change is required for protected policy, workflow, schema, engine version, release permission, and approval record edits.
verification:
  commands:
    - repository: "@control"
      executable: pnpm
      args: ["install", "--frozen-lockfile"]
      timeout_seconds: 900
      required: true
    - repository: "@control"
      executable: pnpm
      args: ["--filter", "@scaflow/schemas", "test"]
      timeout_seconds: 300
      required: true
    - repository: "@control"
      executable: pnpm
      args: ["--filter", "@scaflow/config", "test"]
      timeout_seconds: 300
      required: true
    - repository: "@control"
      executable: pnpm
      args: ["typecheck"]
      timeout_seconds: 300
      required: true
    - repository: "@control"
      executable: pnpm
      args: ["test"]
      timeout_seconds: 900
      required: true
retry_policy:
  max_attempts: 2
  max_repair_rounds_per_attempt: 3
  escalate_after_same_failure: 2
