version: 1
task:
  id: SFL-026
  title: Repair Loop
  type: runtime
  risk_level: R3
  definition_state: ready
objective:
  summary: Implement verification failure summaries, continue session behavior, repair limits, and blocked or failed state decisions.
source_requirements:
  - id: FR-014
    document: docs/source/scaflow-v0.1.0-prd.md
dependencies:
  - SFL-019
  - SFL-022
  - SFL-024
  - SFL-025
repositories:
  primary: "@control"
  scopes:
    - repository: "@control"
      access: read-write
      allowed_paths:
        - packages/core/**
        - packages/codex-runtime/**
        - packages/verification/**
        - packages/state/**
        - apps/cli/**
        - fixtures/**
      forbidden_paths:
        - docs/source/scaflow-v0.1.0-prd.md
        - workspace/repos/**
        - .scaflow/state.db
acceptance_criteria:
  - id: SFL-026-AC-01
    description: Default retry policy uses max_attempts 2, max_repair_rounds_per_attempt 3, and escalate_after_same_failure 2.
  - id: SFL-026-AC-02
    description: Non-repairable failures are not sent back to Agent and transition to blocked or failed.
  - id: SFL-026-AC-03
    description: Repair loop continues the same session when recoverable and re-runs verification after repair.
verification:
  commands:
    - repository: "@control"
      executable: pnpm
      args: ["--filter", "@scaflow/core", "test"]
      timeout_seconds: 300
      required: true
    - repository: "@control"
      executable: pnpm
      args: ["--filter", "@scaflow/verification", "test"]
      timeout_seconds: 300
      required: true
    - repository: "@control"
      executable: pnpm
      args: ["typecheck"]
      timeout_seconds: 300
      required: true
retry_policy:
  max_attempts: 2
  max_repair_rounds_per_attempt: 3
  escalate_after_same_failure: 2
