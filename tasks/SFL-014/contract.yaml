version: 1
task:
  id: SFL-014
  title: Base Workspace Bootstrap
  type: workspace
  risk_level: R2
  definition_state: ready
objective:
  summary: Implement bootstrap, repository status, workspace status/sync, workspace manifest, and post-bootstrap Doctor checks.
source_requirements:
  - id: FR-003
    document: docs/source/scaflow-v0.1.0-prd.md
dependencies:
  - SFL-009
  - SFL-012
  - SFL-013
repositories:
  primary: "@control"
  scopes:
    - repository: "@control"
      access: read-write
      allowed_paths:
        - apps/cli/**
        - packages/workspace/**
        - packages/git/**
        - packages/config/**
        - fixtures/projects/**
        - fixtures/repositories/**
      forbidden_paths:
        - docs/source/scaflow-v0.1.0-prd.md
        - workspace/runs/**
        - .scaflow/state.db
acceptance_criteria:
  - id: SFL-014-AC-01
    description: bootstrap clones missing repositories into workspace/repos and fetches existing matching repositories.
  - id: SFL-014-AC-02
    description: bootstrap never resets, switches branches, deletes, or overwrites developer changes in workspace/repos.
  - id: SFL-014-AC-03
    description: post-bootstrap Doctor checks repository identity, workspace manifest, and repository health.
verification:
  commands:
    - repository: "@control"
      executable: pnpm
      args: ["--filter", "@scaflow/workspace", "test"]
      timeout_seconds: 300
      required: true
    - repository: "@control"
      executable: pnpm
      args: ["--filter", "@scaflow/git", "test"]
      timeout_seconds: 300
      required: true
    - repository: "@control"
      executable: pnpm
      args: ["typecheck"]
      timeout_seconds: 300
      required: true
retry_policy:
  max_attempts: 2
  max_repair_rounds_per_attempt: 3
  escalate_after_same_failure: 2
