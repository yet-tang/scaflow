version: 1
task:
  id: SFL-027
  title: Commit Generation
  type: git
  risk_level: R3
  definition_state: ready
objective:
  summary: Create independent per-repository commits after verification passes without pushing or creating PRs.
source_requirements:
  - id: FR-015
    document: docs/source/scaflow-v0.1.0-prd.md
dependencies:
  - SFL-026
repositories:
  primary: "@control"
  scopes:
    - repository: "@control"
      access: read-write
      allowed_paths:
        - packages/git/**
        - packages/core/**
        - packages/state/**
        - fixtures/**
      forbidden_paths:
        - docs/source/scaflow-v0.1.0-prd.md
        - workspace/repos/**
        - .scaflow/state.db
acceptance_criteria:
  - id: SFL-027-AC-01
    description: Each changed read-write repository gets its own local commit only after all required verification passes.
  - id: SFL-027-AC-02
    description: Commit messages include Task ID, TaskRun ID, Requirement IDs, and Acceptance Criterion IDs.
  - id: SFL-027-AC-03
    description: The implementation does not push, open PRs, merge, or release.
verification:
  commands:
    - repository: "@control"
      executable: pnpm
      args: ["--filter", "@scaflow/git", "test"]
      timeout_seconds: 300
      required: true
    - repository: "@control"
      executable: pnpm
      args: ["--filter", "@scaflow/core", "test"]
      timeout_seconds: 300
      required: true
    - repository: "@control"
      executable: pnpm
      args: ["typecheck"]
      timeout_seconds: 300
      required: true
retry_policy:
  max_attempts: 2
  max_repair_rounds_per_attempt: 3
  escalate_after_same_failure: 2
