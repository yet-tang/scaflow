version: 1
task:
  id: SFL-033
  title: Agent Runtime Sandbox Enforcement
  type: runtime
  risk_level: R3
  definition_state: ready
objective:
  summary: Enforce runtime sandbox policy consistently for SDK and exec adapters, including working directory, writable roots, environment cleaning, network defaults, and forbidden host resources.
source_requirements:
  - id: SEC-001
    document: docs/source/scaflow-v0.1.0-prd.md
  - id: SEC-002
    document: docs/source/scaflow-v0.1.0-prd.md
  - id: SEC-004
    document: docs/source/scaflow-v0.1.0-prd.md
dependencies:
  - SFL-020
  - SFL-023
  - SFL-032
dependency_changes: forbidden
repositories:
  primary: "@control"
  scopes:
    - repository: "@control"
      access: read-write
      allowed_paths:
        - packages/codex-runtime/**
        - packages/config/**
        - packages/core/**
        - packages/verification/**
        - packages/testkit/**
        - fixtures/**
      forbidden_paths:
        - docs/source/scaflow-v0.1.0-prd.md
        - workspace/repos/**
        - .scaflow/state.db
acceptance_criteria:
  - id: SFL-033-AC-01
    description: SDK and exec adapters use the same sandbox policy with TaskRun Bundle as the fixed working directory.
  - id: SFL-033-AC-02
    description: Runtime only exposes declared writable roots and does not pass host secrets, SSH keys, cloud credentials, Docker socket, user home, .scaflow/state.db, engine source, or other TaskRuns.
  - id: SFL-033-AC-03
    description: Agent command network is disabled by default unless allowed by policy.
  - id: SFL-033-AC-04
    description: Security violations terminate the TaskRun and record non-repairable evidence.
verification:
  commands:
    - repository: "@control"
      executable: pnpm
      args: ["--filter", "@scaflow/codex-runtime", "test"]
      timeout_seconds: 300
      required: true
    - repository: "@control"
      executable: pnpm
      args: ["--filter", "@scaflow/verification", "test"]
      timeout_seconds: 300
      required: true
    - repository: "@control"
      executable: pnpm
      args: ["typecheck"]
      timeout_seconds: 300
      required: true
    - repository: "@control"
      executable: pnpm
      args: ["test"]
      timeout_seconds: 900
      required: true
retry_policy:
  max_attempts: 2
  max_repair_rounds_per_attempt: 3
  escalate_after_same_failure: 2
