version: 1
task:
  id: SFL-017
  title: TaskRun Workspace
  type: workspace
  risk_level: R3
  definition_state: completed
objective:
  summary: Implement task prepare, TaskRun Bundle directories, and isolated read-only/read-write worktrees.
source_requirements:
  - id: FR-006
    document: docs/source/scaflow-v0.1.0-prd.md
  - id: G-003
    document: docs/source/scaflow-v0.1.0-prd.md
dependencies:
  - SFL-006
  - SFL-014
  - SFL-016
dependency_changes: forbidden
repositories:
  primary: "@control"
  scopes:
    - repository: "@control"
      access: read-write
      allowed_paths:
        - apps/cli/**
        - packages/workspace/**
        - packages/git/**
        - packages/state/**
        - packages/schemas/**
        - fixtures/**
      forbidden_paths:
        - docs/source/scaflow-v0.1.0-prd.md
        - workspace/repos/**
        - .scaflow/state.db
acceptance_criteria:
  - id: SFL-017-AC-01
    description: task prepare creates workspace/runs/<task-id>/<task-run-id>/ without making the bundle root a Git repository.
  - id: SFL-017-AC-02
    description: read-only scopes use fixed detached HEAD worktrees and read-write scopes use task branch worktrees.
  - id: SFL-017-AC-03
    description: Formal TaskRun preparation never writes task results into workspace/repos.
verification:
  commands:
    - repository: "@control"
      executable: pnpm
      args: ["--filter", "@scaflow/workspace", "test"]
      timeout_seconds: 300
      required: true
    - repository: "@control"
      executable: pnpm
      args: ["--filter", "@scaflow/state", "test"]
      timeout_seconds: 300
      required: true
    - repository: "@control"
      executable: pnpm
      args: ["typecheck"]
      timeout_seconds: 300
      required: true
    - repository: "@control"
      executable: pnpm
      args: ["test"]
      timeout_seconds: 900
      required: true
retry_policy:
  max_attempts: 2
  max_repair_rounds_per_attempt: 3
  escalate_after_same_failure: 2
