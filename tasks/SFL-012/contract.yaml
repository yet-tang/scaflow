version: 1
task:
  id: SFL-012
  title: Git Adapter and Repository Identity
  type: git
  risk_level: R2
  definition_state: ready
objective:
  summary: Provide explicit-cwd Git operations and repository identity checks for later workspace, revision, diff, and commit tasks.
source_requirements:
  - id: FR-002
    document: docs/source/scaflow-v0.1.0-prd.md
  - id: FR-006
    document: docs/source/scaflow-v0.1.0-prd.md
dependencies:
  - SFL-002
repositories:
  primary: "@control"
  scopes:
    - repository: "@control"
      access: read-write
      allowed_paths:
        - packages/git/**
        - packages/testkit/**
        - fixtures/repositories/**
      forbidden_paths:
        - docs/source/scaflow-v0.1.0-prd.md
        - workspace/**
        - .scaflow/**
acceptance_criteria:
  - id: SFL-012-AC-01
    description: Git clone, fetch, status, remote URL, and HEAD commit calls require explicit working directories.
  - id: SFL-012-AC-02
    description: Repository identity can detect mismatched or missing remotes.
  - id: SFL-012-AC-03
    description: Git errors are normalized into structured GitError values.
verification:
  commands:
    - repository: "@control"
      executable: pnpm
      args: ["--filter", "@scaflow/git", "test"]
      timeout_seconds: 300
      required: true
    - repository: "@control"
      executable: pnpm
      args: ["typecheck"]
      timeout_seconds: 300
      required: true
retry_policy:
  max_attempts: 2
  max_repair_rounds_per_attempt: 3
  escalate_after_same_failure: 2
